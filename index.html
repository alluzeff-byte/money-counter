<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Counter</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --accent: #0b6e4f;
      --border: #e2e6ea;
      --field: #ffffff;
      --err: #c0392b;
      --ok: #0b6e4f;
      --badge-admin-bg: #0b6e4f;
      --badge-user-bg: #3454d1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141c;
        --card: #1c1f2b;
        --text: #f4f6f8;
        --muted: #9aa3b2;
        --accent: #35d0a0;
        --border: #2c303c;
        --field: #12141c;
        --err: #ff6b6b;
        --ok: #35d0a0;
        --badge-admin-bg: #147a58;
        --badge-user-bg: #3f5bd9;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      background: var(--card);
      padding: 2.5rem 3rem;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
      max-width: 440px;
      width: calc(100vw - 2rem);
    }
    .label {
      margin: 0 0 0.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .amount {
      margin: 0;
      font-size: 4rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .sub { margin: 0.5rem 0 0; font-size: 0.85rem; color: var(--muted); }
    .userbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .userbar .who { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }
    .badge.admin { background: var(--badge-admin-bg); }
    .badge.user { background: var(--badge-user-bg); }
    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 10px;
    }
    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button[disabled] { opacity: 0.6; cursor: default; }
    input, select {
      font: inherit;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      width: 100%;
    }
    #login-form { display: flex; flex-direction: column; gap: 0.6rem; margin: 1rem 0 0.25rem; text-align: left; }
    .link-btn {
      background: none; border: none; padding: 0.4rem;
      color: var(--muted); text-decoration: underline;
      font-size: 0.8rem; cursor: pointer;
    }
    .msg { color: var(--muted); margin: 0.6rem 0 0; font-size: 0.83rem; min-height: 1.1em; }
    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); }
    .gate p { color: var(--muted); margin: 0.5rem 0 0; }

    .admin-area {
      margin-top: 1.5rem;
      text-align: left;
    }
    .tabs {
      display: flex;
      gap: 0.25rem;
      margin: 0.25rem 0 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      border: none;
      background: none;
      padding: 0.5rem 0.9rem;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      border-radius: 0;
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .fld { display: block; margin-bottom: 1rem; }
    .fld > span:first-child {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .row { display: flex; gap: 0.5rem; }
    .row input { flex: 1; }
    .row button { white-space: nowrap; }
    .admin-area hr { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <!-- Logged out -->
    <section id="gate" class="gate hidden">
      <p class="label">Money Counter</p>
      <p id="gate-msg">Sign in to view this page.</p>

      <form id="login-form">
        <input type="email" id="email" placeholder="Email" autocomplete="username" required>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="primary" id="submit-btn">Log in</button>
      </form>
      <button type="button" class="link-btn" id="forgot-btn">Forgot password?</button>

      <p id="gate-error" class="msg err hidden"></p>
      <p id="gate-note" class="msg hidden"></p>
    </section>

    <!-- Logged in -->
    <section id="app" class="hidden">
      <div class="userbar">
        <span class="who" id="who"></span>
        <span>
          <span class="badge" id="role-badge"></span>
          <button id="logout-btn">Log out</button>
        </span>
      </div>

      <div class="tabs hidden" id="admin-tabs" role="tablist">
        <button type="button" class="tab active" id="tab-users" data-tab="users" role="tab">Users</button>
        <button type="button" class="tab" id="tab-config" data-tab="config" role="tab">Config</button>
      </div>

      <div id="balance-section">
        <p class="label">Balance</p>
        <p class="amount" id="amount">—</p>
        <p class="sub" id="balance-sub"></p>
      </div>

      <div class="admin-area hidden" id="admin-area">
        <div class="tabpanel" id="panel-users" role="tabpanel">
          <label class="fld" id="user-picker">
            <span>View user</span>
            <select id="user-select"></select>
          </label>

          <label class="fld" id="balance-editor">
            <span>Set balance (£)</span>
            <span class="row">
              <input type="number" id="balance-input" min="0" step="0.01" inputmode="decimal">
              <button type="button" class="primary" id="save-balance-btn">Save</button>
            </span>
          </label>
          <p class="msg" id="admin-status"></p>
          <p class="msg hidden" id="no-users-msg">No users yet. Invite someone from the Config tab.</p>
        </div>

        <div class="tabpanel hidden" id="panel-config" role="tabpanel">
          <form class="fld" id="invite-form">
            <span>Invite a user by email</span>
            <span class="row">
              <input type="email" id="invite-email" placeholder="name@example.com" autocomplete="off">
              <button type="submit" class="primary" id="invite-btn">Invite</button>
            </span>
          </form>
          <p class="msg" id="invite-status"></p>

          <hr>

          <label class="fld">
            <span>Assign a name</span>
            <select id="name-user-select"></select>
          </label>
          <label class="fld">
            <span>Name</span>
            <span class="row">
              <input type="text" id="name-input" maxlength="120" autocomplete="off">
              <button type="button" class="primary" id="save-name-btn">Save</button>
            </span>
          </label>
          <p class="msg" id="name-status"></p>
        </div>
      </div>
    </section>
  </main>

  <script>
  (function () {
    var fmt = function (n) {
      return new Intl.NumberFormat('en-GB', {
        style: 'currency', currency: 'GBP', minimumFractionDigits: 0, maximumFractionDigits: 2
      }).format(Number(n) || 0);
    };

    var $ = function (id) { return document.getElementById(id); };
    var gate = $('gate'), app = $('app');
    var who = $('who'), roleBadge = $('role-badge'), amountEl = $('amount'), balanceSub = $('balance-sub');
    var adminArea = $('admin-area');
    var gateMsg = $('gate-msg'), gateError = $('gate-error'), gateNote = $('gate-note');
    var loginForm = $('login-form'), emailInput = $('email'), pwInput = $('password');
    var submitBtn = $('submit-btn'), forgotBtn = $('forgot-btn'), logoutBtn = $('logout-btn');
    var userSelect = $('user-select'), balanceInput = $('balance-input'), saveBtn = $('save-balance-btn');
    var adminStatus = $('admin-status'), inviteForm = $('invite-form'), inviteEmail = $('invite-email'), inviteStatus = $('invite-status');
    var userPicker = $('user-picker'), balanceEditor = $('balance-editor'), noUsersMsg = $('no-users-msg');
    var adminTabs = $('admin-tabs'), balanceSection = $('balance-section');
    var nameUserSelect = $('name-user-select'), nameInput = $('name-input'), saveNameBtn = $('save-name-btn'), nameStatus = $('name-status');
    var tabButtons = document.querySelectorAll('.tab'), tabPanels = { users: $('panel-users'), config: $('panel-config') };

    function selectTab(name) {
      Array.prototype.forEach.call(tabButtons, function (b) {
        b.classList.toggle('active', b.getAttribute('data-tab') === name);
      });
      tabPanels.users.classList.toggle('hidden', name !== 'users');
      tabPanels.config.classList.toggle('hidden', name !== 'config');
      // Balance only makes sense on the Users tab.
      balanceSection.classList.toggle('hidden', name === 'config');
    }
    Array.prototype.forEach.call(tabButtons, function (b) {
      b.addEventListener('click', function () { selectTab(b.getAttribute('data-tab')); });
    });

    function showGate() { app.classList.add('hidden'); gate.classList.remove('hidden'); }
    function showError(m) { gateError.textContent = m; gateError.classList.remove('hidden'); gateNote.classList.add('hidden'); }
    function showNote(m) { gateNote.textContent = m; gateNote.classList.remove('hidden'); gateError.classList.add('hidden'); }
    function clearMsgs() { gateError.classList.add('hidden'); gateNote.classList.add('hidden'); }

    // ===================== Netlify Identity (GoTrue REST) + Functions API =====================
    var ID = '/.netlify/identity';
    var STORE = 'mc.session';

    function saveTokens(t) {
      var s = {
        access_token: t.access_token,
        refresh_token: t.refresh_token,
        expires_at: Date.now() + ((t.expires_in || 3600) * 1000)
      };
      try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {}
      return s;
    }
    function loadTokens() { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } }
    function clearTokens() { try { localStorage.removeItem(STORE); } catch (e) {} }

    function form(body) {
      return {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: Object.keys(body).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(body[k]); }).join('&')
      };
    }
    function jsonReq(body, method) {
      return { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    }
    function errText(d, fb) { return (d && (d.error_description || d.error || d.msg)) || fb; }

    function passwordGrant(email, pw) {
      return fetch(ID + '/token', form({ grant_type: 'password', username: email, password: pw }))
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(errText(res.d, 'Sign in failed. Check your email and password.'));
          return saveTokens(res.d);
        });
    }
    function refreshGrant(rt) {
      return fetch(ID + '/token', form({ grant_type: 'refresh_token', refresh_token: rt }))
        .then(function (r) { if (!r.ok) throw new Error('refresh failed'); return r.json(); })
        .then(saveTokens);
    }

    // Authorised call to our Functions API, with one automatic token refresh on 401.
    function api(path, opts) {
      opts = opts || {};
      var s = loadTokens();
      if (!s || !s.access_token) return Promise.reject(new Error('No session.'));
      function call(token) {
        var headers = {};
        var src = opts.headers || {};
        for (var k in src) headers[k] = src[k];
        headers.Authorization = 'Bearer ' + token;
        var o = {}; for (var j in opts) o[j] = opts[j];
        o.headers = headers;
        return fetch('/api' + path, o);
      }
      return call(s.access_token).then(function (r) {
        if (r.status !== 401 || !s.refresh_token) return r;
        return refreshGrant(s.refresh_token).then(function (fresh) { return call(fresh.access_token); });
      });
    }
    function apiJson(path, opts) {
      return api(path, opts).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (!r.ok) {
            var e = new Error(d.error || ('Request failed (' + r.status + ').'));
            e.status = r.status;
            throw e;
          }
          return d;
        });
      });
    }

    // ---- app state ----
    var selfId = null, usersById = {}, allUsersById = {};

    function invitedSuffix(u) { return u.confirmed ? '' : ' · invited'; }

    function setBalanceView(labelText, amount) {
      amountEl.textContent = (typeof amount === 'number') ? fmt(amount) : (amount || '—');
      balanceSub.textContent = labelText || '';
    }

    function enterApp() {
      clearMsgs();
      gate.classList.add('hidden');
      app.classList.remove('hidden');
      adminStatus.textContent = '';
      inviteStatus.textContent = '';

      return apiJson('/me').then(function (me) {
        selfId = me.id;
        who.textContent = me.name || me.email;
        roleBadge.textContent = me.isAdmin ? 'admin' : 'user';
        roleBadge.className = 'badge ' + (me.isAdmin ? 'admin' : 'user');

        if (me.isAdmin) {
          // Admins have no balance of their own; they manage others.
          setBalanceView('', '—');
          adminTabs.classList.remove('hidden');
          adminArea.classList.remove('hidden');
          selectTab('users');
          loadUsers().catch(function (err) {
            adminStatus.textContent = 'Could not load users: ' + (err.message || 'server error');
            adminStatus.className = 'msg err';
          });
          return;
        }
        setBalanceView('Your balance', me.balance);
        adminTabs.classList.add('hidden');
        adminArea.classList.add('hidden');
        balanceSection.classList.remove('hidden');
      }).catch(function (err) {
        showGate();
        if (err.status === 401) {
          clearTokens();
          showError('Your session expired. Please sign in again.');
        } else {
          // Keep the session so a reload can retry.
          showError((err.message || 'Could not load your account.') + ' Try reloading.');
        }
      });
    }

    function loadUsers() {
      return apiJson('/users').then(function (data) {
        var all = data.users || [];
        allUsersById = {};
        all.forEach(function (u) { allUsersById[u.id] = u; });

        // --- Users tab: non-admins only (admins have no balance) ---
        var managed = all.filter(function (u) { return !u.isAdmin; });
        usersById = {};
        var prevUser = userSelect.value;
        userSelect.innerHTML = '';
        managed.forEach(function (u) {
          usersById[u.id] = u;
          var o = document.createElement('option');
          o.value = u.id;
          o.textContent = u.name + invitedSuffix(u);
          userSelect.appendChild(o);
        });
        var hasUsers = managed.length > 0;
        userPicker.classList.toggle('hidden', !hasUsers);
        balanceEditor.classList.toggle('hidden', !hasUsers);
        noUsersMsg.classList.toggle('hidden', hasUsers);
        if (hasUsers) {
          userSelect.value = (prevUser in usersById) ? prevUser : managed[0].id;
          onUserSelect();
        } else {
          setBalanceView('', '—');
        }

        // --- Config tab: name dropdown lists everyone, incl. admins ---
        var prevName = nameUserSelect.value;
        nameUserSelect.innerHTML = '';
        all.forEach(function (u) {
          var o = document.createElement('option');
          o.value = u.id;
          o.textContent = u.name + (u.isAdmin ? ' · admin' : '') + invitedSuffix(u);
          nameUserSelect.appendChild(o);
        });
        nameUserSelect.value = (prevName && allUsersById[prevName]) ? prevName : selfId;
        onNameUserSelect();
      });
    }

    function onUserSelect() {
      var u = usersById[userSelect.value];
      if (!u) return;
      var label = u.name + (u.confirmed ? '' : ' · invited, not signed in yet');
      setBalanceView(label, u.balance);
      balanceInput.value = u.balance;
      adminStatus.textContent = '';
      adminStatus.className = 'msg';
    }

    function onNameUserSelect() {
      var u = allUsersById[nameUserSelect.value];
      if (!u) return;
      nameInput.value = u.name;
      nameStatus.textContent = '';
      nameStatus.className = 'msg';
    }

    userSelect.addEventListener('change', onUserSelect);
    nameUserSelect.addEventListener('change', onNameUserSelect);

    saveBtn.addEventListener('click', function () {
      var u = usersById[userSelect.value];
      if (!u) return;
      var n = Number(balanceInput.value);
      if (!isFinite(n) || n < 0) {
        adminStatus.textContent = 'Enter a number of 0 or more.';
        adminStatus.className = 'msg err';
        return;
      }
      saveBtn.disabled = true;
      adminStatus.textContent = 'Saving…';
      adminStatus.className = 'msg';
      apiJson('/balance', jsonReq({ userId: u.id, balance: n }, 'PUT'))
        .then(function (res) {
          u.balance = res.balance;
          setBalanceView(u.name + (u.confirmed ? '' : ' · invited, not signed in yet'), res.balance);
          balanceInput.value = res.balance;
          adminStatus.textContent = 'Saved ' + fmt(res.balance) + ' for ' + u.name + '.';
          adminStatus.className = 'msg ok';
        })
        .catch(function (err) {
          adminStatus.textContent = err.message;
          adminStatus.className = 'msg err';
        })
        .then(function () { saveBtn.disabled = false; });
    });

    saveNameBtn.addEventListener('click', function () {
      var u = allUsersById[nameUserSelect.value];
      if (!u) return;
      var newName = (nameInput.value || '').trim();
      saveNameBtn.disabled = true;
      nameStatus.textContent = 'Saving…';
      nameStatus.className = 'msg';
      apiJson('/name', jsonReq({ userId: u.id, name: newName }, 'PUT'))
        .then(function (res) {
          if (u.id === selfId) who.textContent = res.name;
          nameStatus.textContent = 'Saved. Name is now “' + res.name + '”.';
          nameStatus.className = 'msg ok';
          return loadUsers();
        })
        .catch(function (err) {
          nameStatus.textContent = err.message;
          nameStatus.className = 'msg err';
        })
        .then(function () { saveNameBtn.disabled = false; });
    });

    inviteForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = (inviteEmail.value || '').trim();
      if (!email) return;
      $('invite-btn').disabled = true;
      inviteStatus.textContent = 'Sending…';
      inviteStatus.className = 'msg';
      apiJson('/invite', jsonReq({ email: email }))
        .then(function (res) {
          inviteStatus.textContent = 'Invitation sent to ' + res.invited + '. They set a password via the emailed link.';
          inviteStatus.className = 'msg ok';
          inviteEmail.value = '';
          return loadUsers();
        })
        .catch(function (err) {
          inviteStatus.textContent = err.message;
          inviteStatus.className = 'msg err';
        })
        .then(function () { $('invite-btn').disabled = false; });
    });

    logoutBtn.addEventListener('click', function () {
      var s = loadTokens();
      clearTokens();
      showGate();
      gateMsg.textContent = 'Signed out. Sign in to view this page.';
      if (s && s.access_token) {
        fetch(ID + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + s.access_token } }).catch(function () {});
      }
    });

    // ---- invite / recovery links ----
    // Netlify puts the token in the URL fragment, but be lenient and also
    // check the query string.
    var hashParams = new URLSearchParams((location.hash || '').replace(/^#\/?/, ''));
    var queryParams = new URLSearchParams(location.search || '');
    var pick = function (name) { return hashParams.get(name) || queryParams.get(name); };
    var inviteToken = pick('invite_token');
    var recoveryToken = pick('recovery_token');
    var mode = inviteToken ? 'invite' : (recoveryToken ? 'recovery' : 'login');

    function stripHash() {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
    }

    if (mode !== 'login') {
      showGate();
      emailInput.classList.add('hidden');
      emailInput.removeAttribute('required');
      forgotBtn.classList.add('hidden');
      pwInput.setAttribute('autocomplete', 'new-password');
      pwInput.placeholder = 'Choose a password';
      submitBtn.textContent = mode === 'invite' ? 'Set password & sign in' : 'Reset password & sign in';
      gateMsg.textContent = mode === 'invite'
        ? 'You have been invited. Choose a password to finish.'
        : 'Choose a new password.';
    } else {
      // Restore an existing session, if any.
      var s0 = loadTokens();
      if (s0 && s0.access_token) {
        var stale = !s0.expires_at || s0.expires_at < Date.now() + 60000;
        (stale && s0.refresh_token ? refreshGrant(s0.refresh_token) : Promise.resolve(s0))
          .then(function () { return enterApp(); })
          .catch(function () { clearTokens(); showGate(); });
      } else {
        showGate();
      }
    }

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      clearMsgs();
      var pw = pwInput.value;
      submitBtn.disabled = true;
      var original = submitBtn.textContent;
      submitBtn.textContent = 'Working…';
      var reset = function () { submitBtn.disabled = false; submitBtn.textContent = original; };

      var flow;
      if (mode === 'invite') {
        // Netlify GoTrue has accepted both "invite" and "signup" for invited
        // users across versions — try the correct one, then fall back.
        var tryVerify = function (type) {
          return fetch(ID + '/verify', jsonReq({ type: type, token: inviteToken, password: pw }))
            .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); });
        };
        flow = tryVerify('invite')
          .then(function (res) {
            if (res.ok) return res;
            return tryVerify('signup').then(function (res2) {
              if (res2.ok) return res2;
              // Surface whichever error is more informative.
              throw new Error(errText(res2.d, errText(res.d,
                'This invite link is invalid, already used, or expired. Ask the admin to send a new invite.')));
            });
          })
          .then(function (res) { saveTokens(res.d); stripHash(); mode = 'login'; });
      } else if (mode === 'recovery') {
        flow = fetch(ID + '/verify', jsonReq({ type: 'recovery', token: recoveryToken }))
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error(errText(res.d, 'This reset link is invalid or expired.'));
            var sess = saveTokens(res.d);
            return fetch(ID + '/user', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + sess.access_token },
              body: JSON.stringify({ password: pw })
            }).then(function (r) { if (!r.ok) throw new Error('Could not set the new password.'); });
          })
          .then(function () { stripHash(); mode = 'login'; });
      } else {
        flow = passwordGrant(emailInput.value.trim(), pw);
      }

      flow
        .then(function () {
          pwInput.value = '';
          // Restore form to normal login mode for next time.
          emailInput.classList.remove('hidden');
          forgotBtn.classList.remove('hidden');
          submitBtn.textContent = 'Log in';
          return enterApp();
        })
        .then(reset)
        .catch(function (err) { reset(); showError(err.message || 'Something went wrong.'); });
    });

    forgotBtn.addEventListener('click', function () {
      clearMsgs();
      var email = emailInput.value.trim();
      if (!email) { showError('Enter your email above first, then click "Forgot password?".'); return; }
      fetch(ID + '/recover', jsonReq({ email: email }))
        .then(function () { showNote('If that email has an account, a reset link is on its way. Check inbox and spam.'); })
        .catch(function () { showNote('If that email has an account, a reset link is on its way.'); });
    });
  })();
  </script>
</body>
</html>
