<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Counter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b6e4f'/%3E%3Ctext x='33' y='47' font-family='Georgia,%22Times New Roman%22,serif' font-size='46' font-weight='700' fill='%23ffffff' text-anchor='middle'%3E%26%23163;%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#0b6e4f">
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --accent: #0b6e4f;
      --border: #e2e6ea;
      --hist-plus: #d64545;
      --hist-minus: #3454d1;
      --field: #ffffff;
      --err: #c0392b;
      --ok: #0b6e4f;
      --badge-admin-bg: #0b6e4f;
      --badge-user-bg: #3454d1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141c;
        --card: #1c1f2b;
        --text: #f4f6f8;
        --muted: #9aa3b2;
        --accent: #35d0a0;
        --border: #2c303c;
        --hist-plus: #ff7a7a;
        --hist-minus: #7d97ff;
        --field: #12141c;
        --err: #ff6b6b;
        --ok: #35d0a0;
        --badge-admin-bg: #147a58;
        --badge-user-bg: #3f5bd9;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      background: var(--card);
      padding: 2.5rem 3rem;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
      max-width: 440px;
      width: calc(100vw - 2rem);
    }
    .label {
      margin: 0 0 0.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .amount {
      margin: 0;
      font-size: 4rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .sub { margin: 0.5rem 0 0; font-size: 0.85rem; color: var(--muted); }
    .label-row { display: flex; align-items: center; gap: 0.5rem; }
    .label-row .label { flex: 1; margin-bottom: 0; }
    .edge-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.9rem; height: 1.9rem;
      padding: 0;
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 8px;
      font-size: 1.15rem; line-height: 1;
      color: var(--muted);
      cursor: pointer;
    }
    .edge-btn:hover { color: var(--text); border-color: var(--accent); }
    .amount-row { display: flex; align-items: center; }
    .amount-row .amount { flex: 1 1 auto; min-width: 0; text-align: center; }
    .bal-nav {
      flex: 0 0 auto;
      border: none; background: none; cursor: pointer;
      font-size: 2.25rem; line-height: 1; color: var(--muted);
      padding: 0 0.2rem;
    }
    .bal-nav:hover { color: var(--text); }
    .bal-nav.invisible { visibility: hidden; }
    .btn-row { display: flex; gap: 0.5rem; margin-top: 0.25rem; }
    .linkish {
      border: none; background: none; color: var(--muted);
      text-decoration: underline; font-size: 0.8rem; cursor: pointer;
      padding: 0.4rem; margin-top: 0.4rem;
    }
    .linkish:hover { color: var(--text); }
    textarea {
      font: inherit; padding: 0.55rem 0.7rem; border-radius: 10px;
      border: 1px solid var(--border); background: var(--field); color: var(--text);
      width: 100%; resize: vertical;
    }
    .panel-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      text-align: left;
    }
    .box-title {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted);
    }
    .note { font-size: 0.82rem; color: var(--muted); margin: 0; }
    .chk { display: flex; align-items: center; gap: 0.5rem; font-size: 0.88rem; margin-bottom: 0.75rem; cursor: pointer; }
    .chk input { width: auto; }
    #balance-label.editable { cursor: text; }
    #balance-label.editable:hover { color: var(--text); }
    #balance-label.editable::after {
      content: ' \270E';
      font-size: 0.7em;
      opacity: 0;
      transition: opacity 0.12s;
    }
    #balance-label.editable:hover::after { opacity: 0.5; }
    .label-edit {
      font: inherit;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-align: center;
      width: 100%;
      max-width: 260px;
      padding: 0.2rem 0.45rem;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--field);
      color: var(--text);
    }
    .userbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .userbar .who { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }
    .badge.admin { background: var(--badge-admin-bg); }
    .badge.user { background: var(--badge-user-bg); }
    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 10px;
    }
    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button[disabled] { opacity: 0.6; cursor: default; }
    input, select {
      font: inherit;
      padding: 0.55rem 0.7rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      width: 100%;
    }
    #login-form { display: flex; flex-direction: column; gap: 0.6rem; margin: 1rem 0 0.25rem; text-align: left; }
    .link-btn {
      background: none; border: none; padding: 0.4rem;
      color: var(--muted); text-decoration: underline;
      font-size: 0.8rem; cursor: pointer;
    }
    .msg { color: var(--muted); margin: 0.6rem 0 0; font-size: 0.83rem; min-height: 1.1em; }
    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); }
    .gate p { color: var(--muted); margin: 0.5rem 0 0; }

    .admin-area {
      margin-top: 1.5rem;
      text-align: left;
    }
    .tabs {
      display: flex;
      gap: 0.25rem;
      margin: 0.25rem 0 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      border: none;
      background: none;
      padding: 0.5rem 0.9rem;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      border-radius: 0;
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .fld { display: block; margin-bottom: 1rem; }
    .fld > span:first-child {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .row { display: flex; gap: 0.5rem; }
    #balance-editor {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    #balance-input { flex: 0 0 50%; min-width: 0; }
    #balance-editor button { flex: 0 0 auto; }
    .row input { flex: 1; }
    .row button { white-space: nowrap; }
    .admin-area hr { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }
    .history { font-size: 0.8rem; }
    .history ul { list-style: none; margin: 0; padding: 0; }
    .history li { padding: 0.55rem 0; border-top: 1px solid var(--border); color: var(--muted); }
    .history li:first-child { border-top: none; }
    .history .empty { color: var(--muted); margin: 0; }
    .hist-amt { font-weight: 700; }
    .hist-amt.plus { color: var(--hist-plus); }
    .hist-amt.minus { color: var(--hist-minus); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal {
      background: var(--card);
      color: var(--text);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 440px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-head h2 {
      margin: 0;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .modal-close {
      border: none;
      background: none;
      font-size: 1.5rem;
      line-height: 1;
      color: var(--muted);
      padding: 0 0.25rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 0.75rem 1.25rem 1.25rem;
      overflow-y: auto;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <!-- Logged out -->
    <section id="gate" class="gate hidden">
      <p class="label">Money Counter</p>
      <p id="gate-msg">Sign in to view this page.</p>

      <form id="login-form">
        <input type="email" id="email" placeholder="Email" autocomplete="username" required>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="primary" id="submit-btn">Log in</button>
      </form>
      <button type="button" class="link-btn" id="forgot-btn">Forgot password?</button>

      <p id="gate-error" class="msg err hidden"></p>
      <p id="gate-note" class="msg hidden"></p>
    </section>

    <!-- Logged in -->
    <section id="app" class="hidden">
      <div class="userbar">
        <span class="who" id="who"></span>
        <span>
          <span class="badge" id="role-badge"></span>
          <button id="logout-btn">Log out</button>
        </span>
      </div>

      <div class="tabs hidden" id="admin-tabs" role="tablist">
        <button type="button" class="tab active" id="tab-users" data-tab="users" role="tab">Users</button>
        <button type="button" class="tab" id="tab-config" data-tab="config" role="tab">Config</button>
      </div>

      <div id="balance-section">
        <div class="label-row">
          <button type="button" class="edge-btn hidden" id="bal-minus" aria-label="Archive balance">&minus;</button>
          <p class="label" id="balance-label">Balance</p>
          <button type="button" class="edge-btn hidden" id="bal-plus" aria-label="Add balance">+</button>
        </div>
        <div class="amount-row">
          <button type="button" class="bal-nav hidden" id="bal-prev" aria-label="Previous balance">&#8249;</button>
          <p class="amount" id="amount">&mdash;</p>
          <button type="button" class="bal-nav hidden" id="bal-next" aria-label="Next balance">&#8250;</button>
        </div>
        <p class="sub" id="balance-sub"></p>
        <p class="note hidden" id="no-balance-msg"></p>
        <button type="button" id="history-btn" class="linkish hidden">History</button>

        <div id="request-box" class="panel-box hidden">
          <span class="box-title">Request a top-up</span>
          <p id="request-pending" class="note hidden"></p>
          <input type="number" id="request-amount" min="0" step="0.01" inputmode="decimal" placeholder="Amount to add (£)">
          <textarea id="request-comment" rows="2" maxlength="500" placeholder="Comments"></textarea>
          <button type="button" class="primary" id="request-submit">Submit</button>
          <p class="msg" id="request-status"></p>
        </div>
      </div>

      <div class="admin-area hidden" id="admin-area">
        <div class="tabpanel" id="panel-users" role="tabpanel">
          <label class="fld" id="user-picker">
            <span>View user</span>
            <select id="user-select"></select>
          </label>

          <div id="review-box" class="panel-box hidden">
            <span class="box-title">Pending top-up request</span>
            <p id="review-summary" class="note"></p>
            <textarea id="review-comment" rows="2" maxlength="500" placeholder="Comment"></textarea>
            <div class="btn-row">
              <button type="button" class="primary" id="review-approve">Approve</button>
              <button type="button" id="review-reject">Reject</button>
            </div>
            <p class="msg" id="review-status"></p>
          </div>

          <div id="balance-editor">
            <input type="text" id="balance-input" inputmode="text" autocomplete="off" placeholder="20  or  -30">
            <button type="button" class="primary" id="save-balance-btn">Add</button>
          </div>

          <label class="fld" id="bal-view-picker">
            <span>Show</span>
            <select id="bal-view-select">
              <option value="actual">Actual</option>
              <option value="archived">Archived</option>
            </select>
          </label>

          <p class="msg hidden" id="no-users-msg">No users yet. Invite someone from the Config tab.</p>
          <p class="msg" id="admin-status"></p>
        </div>

        <div class="tabpanel hidden" id="panel-config" role="tabpanel">
          <form class="fld" id="invite-form">
            <span>Invite a user by email</span>
            <span class="row">
              <input type="email" id="invite-email" placeholder="name@example.com" autocomplete="off">
              <button type="submit" class="primary" id="invite-btn">Invite</button>
            </span>
          </form>
          <p class="msg" id="invite-status"></p>

          <hr>

          <label class="fld">
            <span>Assign a name</span>
            <select id="name-user-select"></select>
          </label>
          <label class="fld">
            <span>Name</span>
            <span class="row">
              <input type="text" id="name-input" maxlength="120" autocomplete="off">
              <button type="button" class="primary" id="save-name-btn">Save</button>
            </span>
          </label>
          <p class="msg" id="name-status"></p>

          <hr>

          <label class="fld">
            <span>Notification email</span>
            <input type="email" id="notify-email" autocomplete="off">
          </label>
          <label class="chk">
            <input type="checkbox" id="notify-enabled">
            <span>Send mail notifications</span>
          </label>
          <button type="button" class="primary" id="notify-save">Save</button>
          <p class="msg" id="notify-status"></p>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop hidden" id="history-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="history-title">
      <div class="modal-head">
        <h2 id="history-title">History</h2>
        <button type="button" class="modal-close" id="history-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body history" id="history-body"></div>
    </div>
  </div>

  <script>
  (function () {
    var fmt = function (n) {
      return new Intl.NumberFormat('en-GB', {
        style: 'currency', currency: 'GBP', minimumFractionDigits: 0, maximumFractionDigits: 2
      }).format(Number(n) || 0);
    };

    var $ = function (id) { return document.getElementById(id); };
    var gate = $('gate'), app = $('app');
    var who = $('who'), roleBadge = $('role-badge'), amountEl = $('amount'), balanceSub = $('balance-sub');
    var balanceLabelEl = $('balance-label');
    var adminArea = $('admin-area');
    var gateMsg = $('gate-msg'), gateError = $('gate-error'), gateNote = $('gate-note');
    var loginForm = $('login-form'), emailInput = $('email'), pwInput = $('password');
    var submitBtn = $('submit-btn'), forgotBtn = $('forgot-btn'), logoutBtn = $('logout-btn');
    var userSelect = $('user-select'), balanceInput = $('balance-input'), saveBtn = $('save-balance-btn');
    var balPrev = $('bal-prev'), balNext = $('bal-next');
    var balPlus = $('bal-plus'), balMinus = $('bal-minus'), noBalanceMsg = $('no-balance-msg');
    var balViewPicker = $('bal-view-picker'), balViewSelect = $('bal-view-select');
    var adminStatus = $('admin-status'), inviteForm = $('invite-form'), inviteEmail = $('invite-email'), inviteStatus = $('invite-status');
    var userPicker = $('user-picker'), balanceEditor = $('balance-editor'), noUsersMsg = $('no-users-msg');
    var adminTabs = $('admin-tabs'), balanceSection = $('balance-section');
    var nameUserSelect = $('name-user-select'), nameInput = $('name-input'), saveNameBtn = $('save-name-btn'), nameStatus = $('name-status');
    var notifyEmailInput = $('notify-email'), notifyEnabledInput = $('notify-enabled'), notifySaveBtn = $('notify-save'), notifyStatus = $('notify-status');
    var historyBtn = $('history-btn'), historyModal = $('history-modal'), historyBody = $('history-body');
    var historyTitle = $('history-title'), historyClose = $('history-close');
    var requestBox = $('request-box'), requestPending = $('request-pending'), requestAmount = $('request-amount');
    var requestComment = $('request-comment'), requestSubmit = $('request-submit'), requestStatus = $('request-status');
    var reviewBox = $('review-box'), reviewSummary = $('review-summary'), reviewComment = $('review-comment');
    var reviewApprove = $('review-approve'), reviewReject = $('review-reject'), reviewStatus = $('review-status');
    var tabButtons = document.querySelectorAll('.tab'), tabPanels = { users: $('panel-users'), config: $('panel-config') };

    function selectTab(name) {
      Array.prototype.forEach.call(tabButtons, function (b) {
        b.classList.toggle('active', b.getAttribute('data-tab') === name);
      });
      tabPanels.users.classList.toggle('hidden', name !== 'users');
      tabPanels.config.classList.toggle('hidden', name !== 'config');
      // Balance only makes sense on the Users tab.
      balanceSection.classList.toggle('hidden', name === 'config');
    }
    Array.prototype.forEach.call(tabButtons, function (b) {
      b.addEventListener('click', function () { selectTab(b.getAttribute('data-tab')); });
    });

    function showGate() { app.classList.add('hidden'); gate.classList.remove('hidden'); }
    function showError(m) { gateError.textContent = m; gateError.classList.remove('hidden'); gateNote.classList.add('hidden'); }
    function showNote(m) { gateNote.textContent = m; gateNote.classList.remove('hidden'); gateError.classList.add('hidden'); }
    function clearMsgs() { gateError.classList.add('hidden'); gateNote.classList.add('hidden'); }

    // ===================== Netlify Identity (GoTrue REST) + Functions API =====================
    var ID = '/.netlify/identity';
    var STORE = 'mc.session';

    function saveTokens(t) {
      var s = {
        access_token: t.access_token,
        refresh_token: t.refresh_token,
        expires_at: Date.now() + ((t.expires_in || 3600) * 1000)
      };
      try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {}
      return s;
    }
    function loadTokens() { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } }
    function clearTokens() { try { localStorage.removeItem(STORE); } catch (e) {} }

    function form(body) {
      return {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: Object.keys(body).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(body[k]); }).join('&')
      };
    }
    function jsonReq(body, method) {
      return { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    }
    function errText(d, fb) { return (d && (d.error_description || d.error || d.msg)) || fb; }

    function passwordGrant(email, pw) {
      return fetch(ID + '/token', form({ grant_type: 'password', username: email, password: pw }))
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(errText(res.d, 'Sign in failed. Check your email and password.'));
          return saveTokens(res.d);
        });
    }
    function refreshGrant(rt) {
      return fetch(ID + '/token', form({ grant_type: 'refresh_token', refresh_token: rt }))
        .then(function (r) { if (!r.ok) throw new Error('refresh failed'); return r.json(); })
        .then(saveTokens);
    }

    // Authorised call to our Functions API, with one automatic token refresh on 401.
    function api(path, opts) {
      opts = opts || {};
      var s = loadTokens();
      if (!s || !s.access_token) return Promise.reject(new Error('No session.'));
      function call(token) {
        var headers = {};
        var src = opts.headers || {};
        for (var k in src) headers[k] = src[k];
        headers.Authorization = 'Bearer ' + token;
        var o = {}; for (var j in opts) o[j] = opts[j];
        o.headers = headers;
        return fetch('/api' + path, o);
      }
      return call(s.access_token).then(function (r) {
        if (r.status !== 401 || !s.refresh_token) return r;
        return refreshGrant(s.refresh_token).then(function (fresh) { return call(fresh.access_token); });
      });
    }
    function apiJson(path, opts) {
      return api(path, opts).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (!r.ok) {
            var e = new Error(d.error || ('Request failed (' + r.status + ').'));
            e.status = r.status;
            throw e;
          }
          return d;
        });
      });
    }

    // ---- app state ----
    var selfId = null, usersById = {}, allUsersById = {};
    var allBalances = [], balanceIdx = 0, amAdmin = false, balView = 'actual';

    function invitedSuffix(u) { return u.confirmed ? '' : ' · invited'; }

    // Balances in the current Actual/Archived view.
    function visibleBalances() {
      return allBalances.filter(function (b) {
        return balView === 'archived' ? b.archived : !b.archived;
      });
    }
    function curBal() { return visibleBalances()[balanceIdx] || null; }

    function setBalanceHeading(text) {
      if (balanceLabelEl.querySelector('input')) return; // mid-edit
      balanceLabelEl.textContent = text || 'Balance';
    }

    function clearBalances() {
      allBalances = [];
      balanceIdx = 0;
      setBalanceHeading('Balance');
      amountEl.textContent = '—';
      balanceSub.textContent = '';
      balPrev.classList.add('invisible');
      balNext.classList.add('invisible');
      historyBtn.classList.add('hidden');
      reviewBox.classList.add('hidden');
      requestPending.classList.add('hidden');
      noBalanceMsg.classList.add('hidden');
      applyBalanceControls();
    }

    function setBalances(arr, subText) {
      allBalances = Array.isArray(arr) ? arr : [];
      balView = 'actual';
      if (balViewSelect) balViewSelect.value = 'actual';
      balanceSub.textContent = subText || '';
      showBalanceAt(0);
    }

    function showBalanceAt(idx) {
      var list = visibleBalances();
      if (!list.length) {
        balanceIdx = 0;
        setBalanceHeading('Balance');
        amountEl.textContent = '—';
        balPrev.classList.add('invisible');
        balNext.classList.add('invisible');
        historyBtn.classList.add('hidden');
        reviewBox.classList.add('hidden');
        requestPending.classList.add('hidden');
        noBalanceMsg.textContent = 'No ' + balView + ' balances.';
        noBalanceMsg.classList.remove('hidden');
        applyBalanceControls();
        return;
      }
      noBalanceMsg.classList.add('hidden');
      balanceIdx = Math.max(0, Math.min(idx, list.length - 1));
      var b = list[balanceIdx];
      setBalanceHeading(b.label);
      amountEl.textContent = fmt(b.amount);
      balPrev.classList.toggle('invisible', balanceIdx <= 0);
      balNext.classList.toggle('invisible', balanceIdx >= list.length - 1);
      historyBtn.classList.remove('hidden');
      balanceInput.value = ''; // this field is an amount to add/subtract, not the balance
      renderRequestUI(b);
      applyBalanceControls();
    }

    // Show/hide the +, −, view picker and balance editor for the current
    // role and view.
    function applyBalanceControls() {
      var adminWithUser = amAdmin && !!usersById[userSelect.value];
      var hasVisible = visibleBalances().length > 0;
      // + : admin with a user selected, Actual view only
      balPlus.classList.toggle('hidden', !(adminWithUser && balView === 'actual'));
      // − : admin with a user selected, and a balance in view to act on
      balMinus.classList.toggle('hidden', !(adminWithUser && hasVisible));
      balMinus.setAttribute('aria-label', balView === 'archived' ? 'Delete balance' : 'Archive balance');
      balMinus.title = balView === 'archived' ? 'Delete permanently' : 'Move to Archived';
      if (balViewPicker) balViewPicker.classList.toggle('hidden', !adminWithUser);
      // The Set-balance editor and top-up review only apply to Actual balances.
      balanceEditor.classList.toggle('hidden', !(adminWithUser && balView === 'actual' && hasVisible));
      if (balView === 'archived') reviewBox.classList.add('hidden');
    }

    // Show the pending top-up: a review box for the admin, a status line for
    // the balance owner.
    function renderRequestUI(b) {
      var req = b && b.request;
      if (amAdmin) {
        if (req) {
          reviewSummary.textContent = fmt(req.amount) + ' requested by ' + (req.by || 'user')
            + (req.at ? ' · ' + fmtWhen(req.at) : '');
          reviewComment.value = req.comment || '';
          reviewStatus.textContent = '';
          reviewStatus.className = 'msg';
          reviewBox.classList.remove('hidden');
        } else {
          reviewBox.classList.add('hidden');
        }
      } else if (req) {
        requestPending.textContent = 'Pending: ' + fmt(req.amount) + ' awaiting approval'
          + (req.at ? ' (since ' + fmtWhen(req.at) + ')' : '');
        requestPending.classList.remove('hidden');
      } else {
        requestPending.classList.add('hidden');
      }
    }

    balPrev.addEventListener('click', function () { showBalanceAt(balanceIdx - 1); });
    balNext.addEventListener('click', function () { showBalanceAt(balanceIdx + 1); });

    requestSubmit.addEventListener('click', function () {
      var b = curBal();
      if (!b) return;
      var n = Number(requestAmount.value);
      if (!isFinite(n) || n <= 0) {
        requestStatus.textContent = 'Enter an amount greater than 0.';
        requestStatus.className = 'msg err';
        return;
      }
      requestSubmit.disabled = true;
      requestStatus.textContent = 'Submitting…';
      requestStatus.className = 'msg';
      apiJson('/request', jsonReq({ balanceId: b.id, amount: n, comment: requestComment.value }, 'POST'))
        .then(function (res) {
          allBalances = res.balances;
          showBalanceAt(balanceIdx);
          requestAmount.value = '';
          requestComment.value = '';
          requestStatus.textContent = 'Request submitted. An admin will review it.';
          requestStatus.className = 'msg ok';
        })
        .catch(function (err) {
          requestStatus.textContent = err.message;
          requestStatus.className = 'msg err';
        })
        .then(function () { requestSubmit.disabled = false; });
    });

    function reviewAction(path, verb) {
      var u = usersById[userSelect.value];
      var b = curBal();
      if (!u || !b) return;
      reviewApprove.disabled = reviewReject.disabled = true;
      reviewStatus.textContent = 'Working…';
      reviewStatus.className = 'msg';
      apiJson(path, jsonReq({ userId: u.id, balanceId: b.id, comment: reviewComment.value }, 'POST'))
        .then(function (res) {
          u.balances = res.balances;
          allBalances = res.balances;
          showBalanceAt(balanceIdx);
          adminStatus.textContent = verb + ' — balance ' + (path === '/approve' ? 'topped up.' : 'unchanged.');
          adminStatus.className = 'msg ok';
        })
        .catch(function (err) {
          reviewStatus.textContent = err.message;
          reviewStatus.className = 'msg err';
        })
        .then(function () { reviewApprove.disabled = reviewReject.disabled = false; });
    }
    reviewApprove.addEventListener('click', function () { reviewAction('/approve', 'Approved'); });
    reviewReject.addEventListener('click', function () { reviewAction('/reject', 'Rejected'); });

    // Admin: click the "BALANCE" heading to rename the balance currently shown.
    function beginLabelEdit() {
      if (balanceLabelEl.querySelector('input')) return;
      var u = usersById[userSelect.value];
      var b = curBal();
      if (!u || !b) {
        adminStatus.textContent = 'Select a user first.';
        adminStatus.className = 'msg err';
        return;
      }
      var current = b.label || 'Balance';
      var input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 60;
      input.value = current;
      input.className = 'label-edit';
      balanceLabelEl.textContent = '';
      balanceLabelEl.appendChild(input);
      input.focus();
      input.select();

      var settled = false;
      function finish(save) {
        if (settled) return;
        settled = true;
        var val = input.value.trim();
        balanceLabelEl.textContent = (save && val) ? val : current;
        if (!save || val === current) return;
        adminStatus.textContent = 'Saving…';
        adminStatus.className = 'msg';
        apiJson('/balance-label', jsonReq({ userId: u.id, balanceId: b.id, label: val }, 'PUT'))
          .then(function (res) {
            u.balances = res.balances;
            allBalances = res.balances;
            showBalanceAt(balanceIdx);
            adminStatus.textContent = 'Balance renamed for ' + u.name + '.';
            adminStatus.className = 'msg ok';
          })
          .catch(function (err) {
            showBalanceAt(balanceIdx);
            adminStatus.textContent = err.message;
            adminStatus.className = 'msg err';
          });
      }
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      });
      input.addEventListener('blur', function () { finish(true); });
    }
    balanceLabelEl.addEventListener('click', function () {
      if (balanceLabelEl.classList.contains('editable')) beginLabelEdit();
    });

    balPlus.addEventListener('click', function () {
      var u = usersById[userSelect.value];
      if (!u) {
        adminStatus.textContent = 'Select a user first.';
        adminStatus.className = 'msg err';
        return;
      }
      balPlus.disabled = true;
      adminStatus.textContent = 'Adding…';
      adminStatus.className = 'msg';
      apiJson('/balances', jsonReq({ userId: u.id }, 'POST'))
        .then(function (res) {
          u.balances = res.balances;
          allBalances = res.balances;
          showBalanceAt(visibleBalances().length - 1); // jump to the new one
          adminStatus.textContent = 'Added a balance for ' + u.name + '. Rename it via the heading.';
          adminStatus.className = 'msg ok';
        })
        .catch(function (err) {
          adminStatus.textContent = err.message;
          adminStatus.className = 'msg err';
        })
        .then(function () { balPlus.disabled = false; });
    });

    balMinus.addEventListener('click', function () {
      var u = usersById[userSelect.value];
      var b = curBal();
      if (!u || !b) return;
      var archiving = balView === 'actual';
      var msg = archiving
        ? 'Archive “' + b.label + '” (' + fmt(b.amount) + ') for ' + u.name + '?\n\n' +
          'It moves to the Archived list. A pending top-up request is discarded.'
        : 'Permanently delete “' + b.label + '” (' + fmt(b.amount) + ') for ' + u.name + '?\n\n' +
          'This cannot be undone.';
      if (!window.confirm(msg)) return;

      balMinus.disabled = true;
      adminStatus.textContent = archiving ? 'Archiving…' : 'Deleting…';
      adminStatus.className = 'msg';
      apiJson(archiving ? '/balance-archive' : '/balance-delete',
        jsonReq({ userId: u.id, balanceId: b.id }, 'POST'))
        .then(function (res) {
          u.balances = res.balances;
          allBalances = res.balances;
          showBalanceAt(0);
          adminStatus.textContent = archiving
            ? '“' + b.label + '” archived.'
            : '“' + b.label + '” deleted.';
          adminStatus.className = 'msg ok';
        })
        .catch(function (err) {
          adminStatus.textContent = err.message;
          adminStatus.className = 'msg err';
        })
        .then(function () { balMinus.disabled = false; });
    });

    balViewSelect.addEventListener('change', function () {
      balView = balViewSelect.value === 'archived' ? 'archived' : 'actual';
      closeHistory();
      showBalanceAt(0);
    });

    function enterApp() {
      clearMsgs();
      gate.classList.add('hidden');
      app.classList.remove('hidden');
      adminStatus.textContent = '';
      inviteStatus.textContent = '';

      return apiJson('/me').then(function (me) {
        selfId = me.id;
        who.textContent = me.name || me.email;
        roleBadge.textContent = me.isAdmin ? 'admin' : 'user';
        roleBadge.className = 'badge ' + (me.isAdmin ? 'admin' : 'user');

        amAdmin = !!me.isAdmin;

        if (me.isAdmin) {
          // Admins have no balances of their own; they manage others.
          balanceLabelEl.classList.add('editable');
          balanceLabelEl.title = 'Click to rename this balance';
          requestBox.classList.add('hidden');
          notifyEmailInput.value = me.notifyEmail || me.email || '';
          notifyEnabledInput.checked = !!me.notifyEnabled;
          notifyStatus.textContent = '';
          clearBalances();
          adminTabs.classList.remove('hidden');
          adminArea.classList.remove('hidden');
          selectTab('users');
          loadUsers().catch(function (err) {
            adminStatus.textContent = 'Could not load users: ' + (err.message || 'server error');
            adminStatus.className = 'msg err';
          });
          return;
        }
        balanceLabelEl.classList.remove('editable');
        balanceLabelEl.removeAttribute('title');
        requestBox.classList.remove('hidden');
        setBalances(me.balances, 'Your balance');
        adminTabs.classList.add('hidden');
        adminArea.classList.add('hidden');
        balanceSection.classList.remove('hidden');
      }).catch(function (err) {
        showGate();
        if (err.status === 401) {
          clearTokens();
          showError('Your session expired. Please sign in again.');
        } else {
          // Keep the session so a reload can retry.
          showError((err.message || 'Could not load your account.') + ' Try reloading.');
        }
      });
    }

    function loadUsers() {
      return apiJson('/users').then(function (data) {
        var all = data.users || [];
        allUsersById = {};
        all.forEach(function (u) { allUsersById[u.id] = u; });

        // --- Users tab: non-admins only (admins have no balance) ---
        var managed = all.filter(function (u) { return !u.isAdmin; });
        usersById = {};
        var prevUser = userSelect.value;
        userSelect.innerHTML = '';
        managed.forEach(function (u) {
          usersById[u.id] = u;
          var o = document.createElement('option');
          o.value = u.id;
          o.textContent = u.name + invitedSuffix(u);
          userSelect.appendChild(o);
        });
        var hasUsers = managed.length > 0;
        userPicker.classList.toggle('hidden', !hasUsers);
        noUsersMsg.classList.toggle('hidden', hasUsers);
        if (hasUsers) {
          userSelect.value = (prevUser in usersById) ? prevUser : managed[0].id;
          onUserSelect();
        } else {
          clearBalances();
          closeHistory();
        }

        // --- Config tab: name dropdown lists everyone by email, incl. admins ---
        var prevName = nameUserSelect.value;
        nameUserSelect.innerHTML = '';
        all.forEach(function (u) {
          var o = document.createElement('option');
          o.value = u.id;
          o.textContent = u.email;
          nameUserSelect.appendChild(o);
        });
        nameUserSelect.value = (prevName && allUsersById[prevName]) ? prevName : selfId;
        onNameUserSelect();
      });
    }

    function onUserSelect() {
      var u = usersById[userSelect.value];
      if (!u) return;
      var label = u.name + (u.confirmed ? '' : ' · invited, not signed in yet');
      setBalances(u.balances, label);
      adminStatus.textContent = '';
      adminStatus.className = 'msg';
      // Close any history window open for the previous user.
      closeHistory();
    }

    function fmtWhen(iso) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }
    function quote(v) { return '“' + (v == null ? '' : v) + '”'; }

    // { amt: {text, cls} | null, desc: string, total: number | null }
    function histParts(e) {
      var c = e.comment ? ' — ' + quote(e.comment) : '';
      switch (e.type) {
        case 'created': return { desc: 'balance created' };
        case 'renamed': return { desc: 'renamed: ' + quote(e.from) + ' → ' + quote(e.to) };
        case 'archived': return { desc: 'moved to Archived' };
        case 'set': return { desc: 'balance set: ' + fmt(e.from) + ' → ' + fmt(e.to) };
        case 'adjusted': {
          var d = Number(e.delta) || 0;
          return {
            amt: { text: (d >= 0 ? '+' : '−') + fmt(Math.abs(d)), cls: d >= 0 ? 'plus' : 'minus' },
            desc: 'balance adjusted',
            total: typeof e.to === 'number' ? e.to : null,
          };
        }
        case 'topup-approved': return {
          amt: { text: '+' + fmt(e.amount), cls: 'plus' },
          desc: 'top-up approved' + c,
          total: typeof e.total === 'number' ? e.total : null,
        };
        case 'topup-rejected': return { desc: 'top-up rejected: ' + fmt(e.amount) + c };
        default: return { desc: e.type || 'change' };
      }
    }
    function renderHistory(entries) {
      if (!entries || !entries.length) {
        historyBody.innerHTML = '<p class="empty">No changes recorded yet.</p>';
        return;
      }
      var ul = document.createElement('ul');
      entries.forEach(function (e) {
        var p = histParts(e);
        var li = document.createElement('li');
        if (p.amt) {
          var span = document.createElement('span');
          span.className = 'hist-amt ' + p.amt.cls;
          span.textContent = p.amt.text;
          li.appendChild(span);
          li.appendChild(document.createTextNode(' · '));
        }
        var rest = p.desc;
        if (p.total != null) rest += ' · total ' + fmt(p.total);
        rest += ' · ' + fmtWhen(e.at);
        li.appendChild(document.createTextNode(rest));
        ul.appendChild(li);
      });
      historyBody.innerHTML = '';
      historyBody.appendChild(ul);
    }

    function closeHistory() { historyModal.classList.add('hidden'); }
    function openHistory() {
      var b = curBal();
      if (!b) return;
      var title = 'History — ' + b.label;
      if (amAdmin) {
        var u = usersById[userSelect.value];
        if (u) title = 'History — ' + u.name + ' · ' + b.label;
      }
      historyTitle.textContent = title;
      renderHistory((b.history || []).slice().reverse()); // newest first
      historyModal.classList.remove('hidden');
    }

    historyBtn.addEventListener('click', openHistory);
    historyClose.addEventListener('click', closeHistory);
    historyModal.addEventListener('click', function (e) {
      if (e.target === historyModal) closeHistory();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !historyModal.classList.contains('hidden')) closeHistory();
    });

    function onNameUserSelect() {
      var u = allUsersById[nameUserSelect.value];
      if (!u) return;
      nameInput.value = u.name;
      nameStatus.textContent = '';
      nameStatus.className = 'msg';
    }

    userSelect.addEventListener('change', onUserSelect);
    nameUserSelect.addEventListener('change', onNameUserSelect);

    saveBtn.addEventListener('click', function () {
      var u = usersById[userSelect.value];
      var b = curBal();
      if (!u || !b) { adminStatus.textContent = 'Select a user first.'; adminStatus.className = 'msg err'; return; }

      // Every input is an adjustment: a plain number adds, a leading − subtracts.
      var raw = (balanceInput.value || '').trim().replace(/\s+/g, '');
      var n = Number(raw);
      if (raw === '' || !isFinite(n) || n === 0) {
        adminStatus.textContent = 'Enter an amount to add, or −N to subtract.';
        adminStatus.className = 'msg err';
        return;
      }
      var projected = Math.round((b.amount + n) * 100) / 100;
      if (projected < 0) {
        adminStatus.textContent = 'That would make “' + b.label + '” negative (' + fmt(projected) + ').';
        adminStatus.className = 'msg err';
        return;
      }

      var msg = (n >= 0 ? 'Add ' : 'Subtract ') + fmt(Math.abs(n)) + ' ' + (n >= 0 ? 'to' : 'from')
        + ' “' + b.label + '” for ' + u.name + '?\n\n' + fmt(b.amount) + ' → ' + fmt(projected);
      if (!window.confirm(msg)) {
        adminStatus.textContent = 'Cancelled.';
        adminStatus.className = 'msg';
        return;
      }

      saveBtn.disabled = true;
      adminStatus.textContent = 'Working…';
      adminStatus.className = 'msg';
      apiJson('/balance', jsonReq(
        { userId: u.id, balanceId: b.id, amount: n, mode: 'delta' }, 'PUT'
      ))
        .then(function (res) {
          u.balances = res.balances;
          allBalances = res.balances;
          showBalanceAt(balanceIdx);
          var cur = curBal();
          adminStatus.textContent = (n >= 0 ? 'Added ' : 'Subtracted ') + fmt(Math.abs(n))
            + ' — “' + cur.label + '” is now ' + fmt(cur.amount) + '.';
          adminStatus.className = 'msg ok';
        })
        .catch(function (err) {
          adminStatus.textContent = err.message;
          adminStatus.className = 'msg err';
        })
        .then(function () { saveBtn.disabled = false; });
    });

    saveNameBtn.addEventListener('click', function () {
      var u = allUsersById[nameUserSelect.value];
      if (!u) return;
      var newName = (nameInput.value || '').trim();
      saveNameBtn.disabled = true;
      nameStatus.textContent = 'Saving…';
      nameStatus.className = 'msg';
      apiJson('/name', jsonReq({ userId: u.id, name: newName }, 'PUT'))
        .then(function (res) {
          if (u.id === selfId) who.textContent = res.name;
          nameStatus.textContent = 'Saved. Name is now “' + res.name + '”.';
          nameStatus.className = 'msg ok';
          return loadUsers();
        })
        .catch(function (err) {
          nameStatus.textContent = err.message;
          nameStatus.className = 'msg err';
        })
        .then(function () { saveNameBtn.disabled = false; });
    });

    notifySaveBtn.addEventListener('click', function () {
      notifySaveBtn.disabled = true;
      notifyStatus.textContent = 'Saving…';
      notifyStatus.className = 'msg';
      apiJson('/notify', jsonReq({
        email: (notifyEmailInput.value || '').trim(),
        enabled: notifyEnabledInput.checked
      }, 'PUT'))
        .then(function (res) {
          notifyEmailInput.value = res.notifyEmail || '';
          notifyEnabledInput.checked = !!res.notifyEnabled;
          notifyStatus.textContent = res.notifyEnabled

          notifyStatus.textContent = err.message;

        .then(function () { notifySaveBtn.disabled = false; });

    inviteForm.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = (inviteEmail.value || '').trim();
      if (!email) return;
      $('invite-btn').disabled = true;
      inviteStatus.textContent = 'Sending…';
      inviteStatus.className = 'msg';
      apiJson('/invite', jsonReq({ email: email }))
        .then(function (res) {
          inviteStatus.textContent = 'Invitation sent to ' + res.invited + '. They set a password via the emailed link.';
          inviteStatus.className = 'msg ok';
          inviteEmail.value = '';
          return loadUsers();
        })
        .catch(function (err) {
          inviteStatus.textContent = err.message;
          inviteStatus.className = 'msg err';
        })
        .then(function () { $('invite-btn').disabled = false; });
    });

    logoutBtn.addEventListener('click', function () {
      var s = loadTokens();
      clearTokens();
      showGate();
      gateMsg.textContent = 'Signed out. Sign in to view this page.';
      if (s && s.access_token) {
        fetch(ID + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + s.access_token } }).catch(function () {});
      }
    });

    // ---- invite / recovery links ----
    // Netlify puts the token in the URL fragment, but be lenient and also
    // check the query string.
    var hashParams = new URLSearchParams((location.hash || '').replace(/^#\/?/, ''));
    var queryParams = new URLSearchParams(location.search || '');
    var pick = function (name) { return hashParams.get(name) || queryParams.get(name); };
    var inviteToken = pick('invite_token');
    var recoveryToken = pick('recovery_token');
    var mode = inviteToken ? 'invite' : (recoveryToken ? 'recovery' : 'login');

    function stripHash() {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
    }

    if (mode !== 'login') {
      showGate();
      emailInput.classList.add('hidden');
      emailInput.removeAttribute('required');
      forgotBtn.classList.add('hidden');
      pwInput.setAttribute('autocomplete', 'new-password');
      pwInput.placeholder = 'Choose a password';
      submitBtn.textContent = mode === 'invite' ? 'Set password & sign in' : 'Reset password & sign in';
      gateMsg.textContent = mode === 'invite'
        ? 'You have been invited. Choose a password to finish.'
        : 'Choose a new password.';
    } else {
      // Restore an existing session, if any.
      var s0 = loadTokens();
      if (s0 && s0.access_token) {
        var stale = !s0.expires_at || s0.expires_at < Date.now() + 60000;
        (stale && s0.refresh_token ? refreshGrant(s0.refresh_token) : Promise.resolve(s0))
          .then(function () { return enterApp(); })
          .catch(function () { clearTokens(); showGate(); });
      } else {
        showGate();
      }
    }

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      clearMsgs();
      var pw = pwInput.value;
      submitBtn.disabled = true;
      var original = submitBtn.textContent;
      submitBtn.textContent = 'Working…';
      var reset = function () { submitBtn.disabled = false; submitBtn.textContent = original; };

      var flow;
      if (mode === 'invite') {
        // Netlify GoTrue has accepted both "invite" and "signup" for invited
        // users across versions — try the correct one, then fall back.
        var tryVerify = function (type) {
          return fetch(ID + '/verify', jsonReq({ type: type, token: inviteToken, password: pw }))
            .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); });
        };
        flow = tryVerify('invite')
          .then(function (res) {
            if (res.ok) return res;
            return tryVerify('signup').then(function (res2) {
              if (res2.ok) return res2;
              // Surface whichever error is more informative.
              throw new Error(errText(res2.d, errText(res.d,
                'This invite link is invalid, already used, or expired. Ask the admin to send a new invite.')));
            });
          })
          .then(function (res) { saveTokens(res.d); stripHash(); mode = 'login'; });
      } else if (mode === 'recovery') {
        flow = fetch(ID + '/verify', jsonReq({ type: 'recovery', token: recoveryToken }))
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error(errText(res.d, 'This reset link is invalid or expired.'));
            var sess = saveTokens(res.d);
            return fetch(ID + '/user', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + sess.access_token },
              body: JSON.stringify({ password: pw })
            }).then(function (r) { if (!r.ok) throw new Error('Could not set the new password.'); });
          })
          .then(function () { stripHash(); mode = 'login'; });
      } else {
        flow = passwordGrant(emailInput.value.trim(), pw);
      }

      flow
        .then(function () {
          pwInput.value = '';
          // Restore form to normal login mode for next time.
          emailInput.classList.remove('hidden');
          forgotBtn.classList.remove('hidden');
          submitBtn.textContent = 'Log in';
          return enterApp();
        })
        .then(reset)
        .catch(function (err) { reset(); showError(err.message || 'Something went wrong.'); });
    });

    forgotBtn.addEventListener('click', function () {
      clearMsgs();
      var email = emailInput.value.trim();
      if (!email) { showError('Enter your email above first, then click "Forgot password?".'); return; }
      fetch(ID + '/recover', jsonReq({ email: email }))
        .then(function () { showNote('If that email has an account, a reset link is on its way. Check inbox and spam.'); })
        .catch(function () { showNote('If that email has an account, a reset link is on its way.'); });
    });
  })();
  </script>
</body>
</html>
