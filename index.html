<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Counter</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --accent: #0b6e4f;
      --border: #e2e6ea;
      --field: #ffffff;
      --err: #c0392b;
      --badge-admin-bg: #0b6e4f;
      --badge-user-bg: #3454d1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141c;
        --card: #1c1f2b;
        --text: #f4f6f8;
        --muted: #9aa3b2;
        --accent: #35d0a0;
        --border: #2c303c;
        --field: #12141c;
        --err: #ff6b6b;
        --badge-admin-bg: #147a58;
        --badge-user-bg: #3f5bd9;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      background: var(--card);
      padding: 2.5rem 3rem;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
      max-width: 420px;
      width: calc(100vw - 2rem);
    }
    .label {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .amount {
      margin: 0;
      font-size: 4.5rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .userbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .userbar .who { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }
    .badge.admin { background: var(--badge-admin-bg); }
    .badge.user { background: var(--badge-user-bg); }
    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 10px;
    }
    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button[disabled] { opacity: 0.6; cursor: default; }
    #login-form { display: flex; flex-direction: column; gap: 0.6rem; margin: 1rem 0 0.25rem; text-align: left; }
    #login-form input {
      font: inherit;
      padding: 0.6rem 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      width: 100%;
    }
    #login-form button { margin-top: 0.25rem; }
    .link-btn {
      background: none; border: none; padding: 0.4rem;
      color: var(--muted); text-decoration: underline;
      font-size: 0.8rem; cursor: pointer;
    }
    .msg { color: var(--muted); margin: 0.5rem 0 0; font-size: 0.85rem; }
    .err { color: var(--err); margin: 0.6rem 0 0; font-size: 0.83rem; }
    .admin-area {
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--border);
      font-size: 0.85rem;
      color: var(--muted);
      text-align: left;
    }
    .admin-area h2 {
      margin: 0 0 0.35rem;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
    }
    .hidden { display: none !important; }
    .gate p { color: var(--muted); margin: 0.5rem 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <!-- Shown when logged out -->
    <section id="gate" class="gate hidden">
      <p class="label">Money Counter</p>
      <p id="gate-msg">Sign in to view this page.</p>

      <!-- Email/password form (Netlify) -->
      <form id="login-form">
        <input type="email" id="email" placeholder="Email" autocomplete="username" required>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="primary" id="submit-btn">Log in</button>
      </form>
      <button type="button" class="link-btn" id="forgot-btn">Forgot password?</button>

      <!-- SSO button (Azure) -->
      <button type="button" class="primary hidden" id="sso-btn">Sign in with GitHub</button>

      <p id="gate-error" class="err hidden"></p>
      <p id="gate-note" class="msg hidden"></p>
    </section>

    <!-- Shown when logged in -->
    <section id="app" class="hidden">
      <div class="userbar">
        <span class="who" id="who"></span>
        <span>
          <span class="badge" id="role-badge"></span>
          <button id="logout-btn">Log out</button>
        </span>
      </div>
      <p class="label">Balance</p>
      <p class="amount" id="amount"></p>

      <div class="admin-area hidden" id="admin-area">
        <h2>Admin</h2>
        <p>Admin-only controls will go here. (Differences between admin and user accounts to be defined.)</p>
      </div>
    </section>
  </main>

  <script>
  (function () {
    var value = 750;
    var formatted = new Intl.NumberFormat('en-GB', {
      style: 'currency', currency: 'GBP', minimumFractionDigits: 0
    }).format(value);

    var $ = function (id) { return document.getElementById(id); };
    var gate = $('gate'), app = $('app');
    var who = $('who'), roleBadge = $('role-badge'), adminArea = $('admin-area'), amountEl = $('amount');
    var gateMsg = $('gate-msg'), gateError = $('gate-error'), gateNote = $('gate-note');
    var loginForm = $('login-form'), emailInput = $('email'), pwInput = $('password');
    var submitBtn = $('submit-btn'), forgotBtn = $('forgot-btn'), ssoBtn = $('sso-btn'), logoutBtn = $('logout-btn');

    // session: null, or { email, isAdmin }
    function render(session) {
      if (!session) {
        app.classList.add('hidden');
        gate.classList.remove('hidden');
        return;
      }
      who.textContent = session.email;
      roleBadge.textContent = session.isAdmin ? 'admin' : 'user';
      roleBadge.className = 'badge ' + (session.isAdmin ? 'admin' : 'user');
      amountEl.textContent = formatted;
      adminArea.classList.toggle('hidden', !session.isAdmin);
      gate.classList.add('hidden');
      app.classList.remove('hidden');
    }
    function showError(msg) { gateError.textContent = msg; gateError.classList.remove('hidden'); gateNote.classList.add('hidden'); }
    function showNote(msg) { gateNote.textContent = msg; gateNote.classList.remove('hidden'); gateError.classList.add('hidden'); }
    function clearMsgs() { gateError.classList.add('hidden'); gateNote.classList.add('hidden'); }

    var host = location.hostname;
    var useNetlifyIdentity = /(^|\.)netlify\.app$/.test(host) || host === 'localhost' || host === '127.0.0.1';

    if (!useNetlifyIdentity) {
      // ================= Azure Static Web Apps built-in auth =================
      loginForm.classList.add('hidden');
      forgotBtn.classList.add('hidden');
      ssoBtn.classList.remove('hidden');
      gateMsg.textContent = 'Sign in to view this page.';
      ssoBtn.addEventListener('click', function () {
        window.location.href = '/.auth/login/github?post_login_redirect_uri=%2F';
      });
      logoutBtn.addEventListener('click', function () {
        window.location.href = '/.auth/logout?post_logout_redirect_uri=%2Flogin';
      });
      fetch('/.auth/me', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : { clientPrincipal: null }; })
        .then(function (data) {
          var p = data && data.clientPrincipal;
          if (!p) { render(null); return; }
          render({ email: p.userDetails, isAdmin: (p.userRoles || []).indexOf('admin') !== -1 });
        })
        .catch(function () { render(null); });
      return;
    }

    // ================= Netlify Identity (GoTrue REST, same-origin) =================
    var API = '/.netlify/identity';
    var STORE = 'mc.session';

    function saveTokens(t) {
      var s = {
        access_token: t.access_token,
        refresh_token: t.refresh_token,
        expires_at: Date.now() + ((t.expires_in || 3600) * 1000)
      };
      try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) {}
      return s;
    }
    function loadTokens() {
      try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; }
    }
    function clearTokens() { try { localStorage.removeItem(STORE); } catch (e) {} }

    function form(body) {
      return {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: Object.keys(body).map(function (k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(body[k]);
        }).join('&')
      };
    }
    function json(body) {
      return { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    }
    function parseErr(data, fallback) {
      return (data && (data.error_description || data.msg || data.error)) || fallback;
    }

    function passwordGrant(email, pw) {
      return fetch(API + '/token', form({ grant_type: 'password', username: email, password: pw }))
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(parseErr(res.d, 'Sign in failed. Check your email and password.'));
          return saveTokens(res.d);
        });
    }
    function refreshGrant(rt) {
      return fetch(API + '/token', form({ grant_type: 'refresh_token', refresh_token: rt }))
        .then(function (r) { if (!r.ok) throw new Error('refresh failed'); return r.json(); })
        .then(saveTokens);
    }
    function fetchUser(at) {
      return fetch(API + '/user', { headers: { Authorization: 'Bearer ' + at } })
        .then(function (r) { if (!r.ok) throw new Error('user ' + r.status); return r.json(); });
    }
    function toSession(u) {
      var roles = (u.app_metadata && u.app_metadata.roles) || [];
      return { email: u.email, isAdmin: roles.indexOf('admin') !== -1 };
    }

    // Restore an existing session on page load (refresh the token if stale).
    function restore() {
      var s = loadTokens();
      if (!s || !s.access_token) { render(null); return; }
      var stale = !s.expires_at || s.expires_at < Date.now() + 60000;
      var ready = stale && s.refresh_token
        ? refreshGrant(s.refresh_token)
        : Promise.resolve(s);
      ready
        .then(function (fresh) { return fetchUser(fresh.access_token); })
        .then(function (u) { render(toSession(u)); })
        .catch(function () {
          // One more try via refresh, then give up to the login form.
          var cur = loadTokens();
          if (cur && cur.refresh_token) {
            return refreshGrant(cur.refresh_token)
              .then(function (fresh) { return fetchUser(fresh.access_token); })
              .then(function (u) { render(toSession(u)); })
              .catch(function () { clearTokens(); render(null); });
          }
          clearTokens(); render(null);
        });
    }

    // ---- Invite / recovery links: #invite_token=... or #recovery_token=... ----
    var hash = new URLSearchParams((location.hash || '').replace(/^#\/?/, ''));
    var inviteToken = hash.get('invite_token');
    var recoveryToken = hash.get('recovery_token');
    var mode = inviteToken ? 'invite' : (recoveryToken ? 'recovery' : 'login');

    function stripHash() {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
    }

    if (mode === 'invite' || mode === 'recovery') {
      gate.classList.remove('hidden');
      emailInput.classList.add('hidden');
      emailInput.removeAttribute('required');
      forgotBtn.classList.add('hidden');
      pwInput.setAttribute('autocomplete', 'new-password');
      pwInput.placeholder = 'Choose a password';
      submitBtn.textContent = mode === 'invite' ? 'Set password & sign in' : 'Reset password & sign in';
      gateMsg.textContent = mode === 'invite'
        ? 'You have been invited. Choose a password to finish.'
        : 'Choose a new password.';
    } else {
      restore();
    }

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      clearMsgs();
      var pw = pwInput.value;
      submitBtn.disabled = true;
      var original = submitBtn.textContent;
      submitBtn.textContent = 'Working…';
      var done = function () { submitBtn.disabled = false; submitBtn.textContent = original; };

      var flow;
      if (mode === 'invite') {
        flow = fetch(API + '/verify', json({ type: 'signup', token: inviteToken, password: pw }))
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error(parseErr(res.d, 'This invite link is invalid or expired. Ask for a new invite.'));
            saveTokens(res.d); stripHash(); mode = 'login';
            return fetchUser(res.d.access_token);
          });
      } else if (mode === 'recovery') {
        flow = fetch(API + '/verify', json({ type: 'recovery', token: recoveryToken }))
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error(parseErr(res.d, 'This reset link is invalid or expired.'));
            var s = saveTokens(res.d);
            return fetch(API + '/user', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token },
              body: JSON.stringify({ password: pw })
            }).then(function (r) { if (!r.ok) throw new Error('Could not set the new password.'); return r.json(); })
              .then(function (u) { stripHash(); mode = 'login'; return u; });
          });
      } else {
        flow = passwordGrant(emailInput.value.trim(), pw)
          .then(function (s) { return fetchUser(s.access_token); });
      }

      flow
        .then(function (u) { done(); pwInput.value = ''; render(toSession(u)); })
        .catch(function (err) { done(); showError(err.message || 'Something went wrong.'); });
    });

    forgotBtn.addEventListener('click', function () {
      clearMsgs();
      var email = emailInput.value.trim();
      if (!email) { showError('Enter your email above first, then click "Forgot password?".'); return; }
      fetch(API + '/recover', json({ email: email }))
        .then(function () {
          showNote('If that email has an account, a password-reset link is on its way. Check your inbox and spam.');
        })
        .catch(function () { showNote('If that email has an account, a reset link is on its way.'); });
    });

    logoutBtn.addEventListener('click', function () {
      var s = loadTokens();
      clearTokens();
      render(null);
      if (s && s.access_token) {
        fetch(API + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + s.access_token } })
          .catch(function () {});
      }
    });
  })();
  </script>
</body>
</html>
